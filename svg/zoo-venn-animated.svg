<svg role="img" aria-label="Zoo" viewBox="222 221 580 580" xmlns="http://www.w3.org/2000/svg">
<!-- Golden-ratio (phi) lotus bloom → exact prism → hover: one spin → press: squash. Pure CSS, no JS. Generated from the @hanzo logo tuner — edit there, not here. -->
<defs>
<clipPath id="oc"><circle cx="512" cy="511" r="270"/></clipPath>
<clipPath id="gc"><circle cx="513" cy="369" r="234"/></clipPath>
<clipPath id="rc"><circle cx="365" cy="595" r="234"/></clipPath>
</defs>
<style>.zg{transform-box:view-box;transform-origin:512px 511px;opacity:0;animation:zgk 0.62s cubic-bezier(.22,1,.36,1) 0.00s forwards}
@keyframes zgk{0%{opacity:0;transform:rotate(-105deg) scale(0.62)}30%{opacity:.85}100%{opacity:1;transform:rotate(0deg) scale(1)}}
.zb{transform-box:view-box;transform-origin:512px 511px;opacity:0;animation:zbk 1.00s cubic-bezier(.22,1,.36,1) 0.00s forwards}
@keyframes zbk{0%{opacity:0;transform:rotate(-157.6deg) scale(0.62)}30%{opacity:.85}100%{opacity:1;transform:rotate(0deg) scale(1)}}
.zh{transform-box:view-box;transform-origin:512px 511px;opacity:0;animation:zhk 1.62s cubic-bezier(.22,1,.36,1) 0.00s forwards}
@keyframes zhk{0%{opacity:0;transform:rotate(-262.6deg) scale(0.62)}30%{opacity:.85}100%{opacity:1;transform:rotate(0deg) scale(1)}}
/* interaction — pure CSS, no JS: hover = one graceful turn (returns to rest), press = squash */
.zoo-hov{transform-box:view-box;transform-origin:512px 511px}
.zoo-prs{transform-box:view-box;transform-origin:512px 511px;transition:transform .22s cubic-bezier(.22,1,.36,1)}
svg:hover .zoo-hov{animation:zooTurn 1.1s cubic-bezier(.45,0,.2,1)}
svg:active .zoo-prs{transform:scale(.95)}
@keyframes zooTurn{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.zoo-hov,.zoo-prs{animation:none!important;transform:none!important}.zg,.zb,.zh{opacity:1;animation:none;transform:none}}
</style>
<g class="zoo-hov"><g class="zoo-prs">
<g clip-path="url(#oc)">
<circle cx="512" cy="511" r="270" fill="#ED1C24"/>
<g class="zg"><circle cx="513" cy="369" r="234" fill="#00A652"/><g clip-path="url(#gc)"><circle cx="365" cy="595" r="234" fill="#FCF006"/></g></g>
<g class="zb"><circle cx="643" cy="595" r="234" fill="#2E3192"/></g>
<g class="zh"><g clip-path="url(#gc)"><circle cx="643" cy="595" r="234" fill="#01ACF1"/></g><g clip-path="url(#rc)"><circle cx="643" cy="595" r="234" fill="#EA018E"/></g><g clip-path="url(#gc)"><g clip-path="url(#rc)"><circle cx="643" cy="595" r="234" fill="#FFFFFF"/></g></g></g>
</g>
</g></g>
</svg>